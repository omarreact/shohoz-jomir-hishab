name: Temporary CI repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ci-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install missing Leaflet React bindings
        run: npm install react-leaflet@5.0.0 --save --no-audit --no-fund
      - name: Apply TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace('tsconfig.json', '"target": "ES2017"', '"target": "ES2020"')

          replace(
              'src/modules/khatiyan/gis-bridge.ts',
              'export function sendPlotToKhatiyan(plot: KhatiyanPlot): void {',
              'export function consumePendingPlot(): PendingKhatiyanPlot | null {\n  return useKhatiyanGisBridge.getState().consumePendingPlot();\n}\n\nexport function sendPlotToKhatiyan(plot: KhatiyanPlot): void {',
          )

          replace(
              'src/features/faraez/components/FaraezResult.tsx',
              'function measurementText(measurement: HeirResult["measurements"] extends readonly (infer T)[] | undefined ? T : never): string {',
              'function measurementText(measurement: HeirResult["measurements"] extends readonly (infer T)[] | undefined ? T | undefined : never): string {',
          )

          replace(
              'src/features/geospatial-map/maplibre/MapLibreMap.tsx',
              'import maplibregl, {\n  type GeoJSONSource,\n  type Map as MapLibreInstance,\n  type MapGeoJSONFeature,\n} from "maplibre-gl";',
              'import * as maplibregl from "maplibre-gl";\nimport type {\n  GeoJSONSource,\n  Map as MapLibreInstance,\n  MapGeoJSONFeature,\n} from "maplibre-gl";',
          )
          replace(
              'src/features/geospatial-map/maplibre/MapLibreMap.tsx',
              'const extentTimerRef = useRef<ReturnType<typeof window.setTimeout> | null>(null);',
              'const extentTimerRef = useRef<number | null>(null);',
          )
          replace(
              'src/features/geospatial-map/maplibre/MapLibreMap.tsx',
              'const vector = features.find((feature) => feature.geometry?.type === "Polygon");',
              'const vector = features.find((feature: MapGeoJSONFeature) => feature.geometry?.type === "Polygon");',
          )
          replace(
              'src/features/geospatial-map/maplibre/MapLibreMap.tsx',
              'const point = { type: "Feature", geometry: { type: "Point", coordinates: [longitude, latitude] }, properties: {} } as const;',
              'const point: GeoJSON.Feature<GeoJSON.Point> = { type: "Feature", geometry: { type: "Point", coordinates: [longitude, latitude] }, properties: {} };',
          )

          replace(
              'app/faraez/page.tsx',
              ', pagebreak: { mode: ["avoid-all", "css", "legacy"] }',
              '',
          )
          PY
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tsconfig.json src/modules/khatiyan/gis-bridge.ts src/features/faraez/components/FaraezResult.tsx src/features/geospatial-map/maplibre/MapLibreMap.tsx app/faraez/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m '[ci-repair] fix typecheck and missing dependency'
          git push
