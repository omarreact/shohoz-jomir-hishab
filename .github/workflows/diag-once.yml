name: Temporary one-shot typecheck report

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck > typecheck-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck-report.txt
