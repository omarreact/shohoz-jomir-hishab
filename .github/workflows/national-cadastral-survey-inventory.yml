name: National Cadastral Survey Metadata Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/maps/national-cadastral-dlrms-survey-inventory.mjs"
      - ".github/workflows/national-cadastral-survey-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: national-cadastral-survey-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/maps/national-cadastral-dlrms-survey-inventory.mjs
      - name: Read-only DLRMS administrative survey inventory
        run: node scripts/maps/national-cadastral-dlrms-survey-inventory.mjs
      - name: Upload metadata inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-cadastral-dlrms-survey-inventory
          path: artifacts/national-cadastral/dlrms-survey-inventory.json
          if-no-files-found: warn
          retention-days: 7
