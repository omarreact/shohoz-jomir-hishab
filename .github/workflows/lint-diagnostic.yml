name: Temporary lint diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[lint-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Capture lint output
        run: npm run lint > lint-diagnostic.txt 2>&1 || true
      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostic
          path: lint-diagnostic.txt
