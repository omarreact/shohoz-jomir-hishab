name: Temporary final typecheck repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[final-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply final typecheck repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace('app/faraez/page.tsx',
              'import { consumePendingPlot } from "@/src/modules/khatiyan/gis-bridge";',
              'import { consumePendingPlot, type PendingKhatiyanPlot } from "@/src/modules/khatiyan/gis-bridge";')
          replace('app/faraez/page.tsx',
              '    if (activeDraft.provenance) {\n      setGisPlot(activeDraft.provenance as ReturnType<typeof consumePendingPlot>);\n    }',
              '    if (activeDraft.provenance) {\n      const provenance = activeDraft.provenance as Record<string, unknown>;\n      const plot = provenance.plot;\n      if (plot && typeof plot === "object") {\n        setGisPlot({\n          plot: plot as PendingKhatiyanPlot["plot"],\n          source: "rajuk",\n          selectedAt: typeof provenance.selectedAt === "number" ? provenance.selectedAt : Date.now(),\n          selectionId: typeof provenance.selectionId === "string" ? provenance.selectionId : `${String(provenance.plotId ?? "plot")}-${typeof provenance.selectedAt === "number" ? provenance.selectedAt : Date.now()}`,\n        });\n      }\n    }')

          replace('src/features/geospatial-map/maplibre/MapLibreMap.tsx',
              '      attributionControl: true,\n',
              '')

          replace('src/modules/faraez/types.ts',
              '  assets: { land: number; gold: number; cash: number };',
              '  assets: { land: number; gold: number; cash: number; total?: number };')

          replace('src/modules/khatiyan/calculations.ts',
              '    const ownerPlots = [];',
              '    const ownerPlots: KhatiyanOwnerResult["ownerPlots"] = [];')

          replace('src/modules/khatiyan/share-normalization.test.ts',
              'import { describe, expect, it } from "vitest";\n',
              '')

          replace('src/shared/lib/export.ts',
              '        pagebreak: { mode: ["avoid-all", "css", "legacy"] },\n',
              '')
          PY
      - name: Commit final repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/faraez/page.tsx src/features/geospatial-map/maplibre/MapLibreMap.tsx src/modules/faraez/types.ts src/modules/khatiyan/calculations.ts src/modules/khatiyan/share-normalization.test.ts src/shared/lib/export.ts
          git diff --cached --quiet && exit 0
          git commit -m '[final-repair] resolve remaining typecheck blockers'
          git push
