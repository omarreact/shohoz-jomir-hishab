name: Fix MS address cascade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MS address source
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/rajuk-test/page.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('function useLocationCascade() {', 'function useLocationCascade(kind: PlotTab) {'),
              ('apiJson(`/api/rajuk/query?action=mouzas&t_guid=${encodeURIComponent(tGuid)}`)', 'apiJson(`/api/rajuk/query?action=mouzas&t_guid=${encodeURIComponent(tGuid)}&kind=${kind}`)'),
              ('  }, [tGuid]);', '  }, [tGuid, kind]);'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected page pattern not found: {old}')
              s = s.replace(old, new, 1)
          old = '  const loc = useLocationCascade();'
          if s.count(old) != 2:
              raise SystemExit(f'Expected exactly 2 cascade initializers, found {s.count(old)}')
          s = s.replace(old, '  const loc = useLocationCascade("rs");', 1)
          s = s.replace(old, '  const loc = useLocationCascade("ms");', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/api/rajuk/query/route.ts')
          s = p.read_text(encoding='utf-8')
          old = '      const tGuid = p.get("t_guid");\n      if (!tGuid) return NextResponse.json({ error: "t_guid is required" }, { status: 400 });\n      return NextResponse.json({ features: await getMouzas(tGuid) });'
          new = '      const tGuid = p.get("t_guid");\n      if (!tGuid) return NextResponse.json({ error: "t_guid is required" }, { status: 400 });\n      const kindParam = p.get("kind");\n      const kind = kindParam === "ms" ? "ms" : "rs";\n      return NextResponse.json({ features: await getMouzas(tGuid, kind) });'
          if old not in s:
              raise SystemExit('Expected route mouza block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/services/rajuk/rajukQuery.service.ts')
          s = p.read_text(encoding='utf-8')
          old = '''export async function getMouzas(tGuid: string): Promise<RajukMauza[]> {
  const data = await requestLayer<{ features?: { attributes: RajukMauza }[] }>(1, {
    where: `t_guid='${escapeSql(tGuid)}'`,
    outFields: "mauza,jl_no,m_guid,t_guid,d_guid,upazila_ps,m_district",
    returnGeometry: false,
    orderByFields: "mauza ASC",
    resultRecordCount: 5000,
  });
  return (data.features ?? []).map((f) => f.attributes);
}'''
          new = '''export async function getMouzas(tGuid: string, kind: "rs" | "ms" = "rs"): Promise<RajukMauza[]> {
  if (kind === "ms") {
    // MS has its own JL numbering. Do not reuse the RS mouza/JL layer (1).
    const context = await requestLayer<{
      features?: { attributes: Pick<RajukUpazila, "upazila_ps" | "m_district" | "t_guid" | "d_guid"> }[];
    }>(9, {
      where: `t_guid='${escapeSql(tGuid)}'`,
      outFields: "upazila_ps,m_district,t_guid,d_guid",
      returnGeometry: false,
      resultRecordCount: 1,
    });
    const admin = context.features?.[0]?.attributes;
    if (!admin?.upazila_ps) return [];

    const addressTerms = [admin.upazila_ps, admin.m_district].filter(Boolean).map((v) =>
      `address_search LIKE '%${escapeSql(String(v).trim())}%'`,
    );
    const data = await requestLayer<{ features?: { attributes: RajukMauza }[] }>(LAYER_MS_PLOT, {
      where: addressTerms.join(" AND "),
      outFields: "mauza,jl_no,upazila_ps,m_district",
      returnGeometry: false,
      returnDistinctValues: true,
      orderByFields: "mauza ASC, jl_no ASC",
      resultRecordCount: 5000,
    });

    return (data.features ?? []).map((f, index) => ({
      ...f.attributes,
      m_guid: `ms-${String(f.attributes.mauza ?? "").trim()}-${String(f.attributes.jl_no ?? "").trim()}-${index}`,
      t_guid: admin.t_guid,
      d_guid: admin.d_guid,
      upazila_ps: f.attributes.upazila_ps || admin.upazila_ps,
      m_district: f.attributes.m_district || admin.m_district,
    }));
  }

  const data = await requestLayer<{ features?: { attributes: RajukMauza }[] }>(1, {
    where: `t_guid='${escapeSql(tGuid)}'`,
    outFields: "mauza,jl_no,m_guid,t_guid,d_guid,upazila_ps,m_district",
    returnGeometry: false,
    orderByFields: "mauza ASC",
    resultRecordCount: 5000,
  });
  return (data.features ?? []).map((f) => f.attributes);
}'''
          if old not in s:
              raise SystemExit('Expected getMouzas implementation not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rajuk-test/page.tsx app/api/rajuk/query/route.ts src/services/rajuk/rajukQuery.service.ts
          git rm .github/workflows/fix-ms-address.yml
          git commit -m "fix: use independent MS mouza and JL source"
          git push origin HEAD:main
