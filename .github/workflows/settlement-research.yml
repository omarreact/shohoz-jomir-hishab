name: Settlement BRS 349 research

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inspect MapSearch JavaScript request contracts
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import json, ssl, urllib.request

          url = "https://settlement.gov.bd/js/MapSearch.js"
          req = urllib.request.Request(url, headers={
              "User-Agent":"Mozilla/5.0 (compatible; LandBDResearch/1.0)",
              "Referer":"https://settlement.gov.bd/Map/MapSearch",
          })
          with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as r:
              js = r.read().decode("utf-8", "replace")

          with open("research-output/MapSearch.js", "w", encoding="utf-8") as f:
              f.write(js)

          targets = [
              "GetKhatianDataList_MapSearch",
              "GetSheetListBySurveyMap",
              "GetMouzaListBySurveyMapForshet",
              "GetSheetJsonBySurvey",
          ]
          out = {}
          for t in targets:
              contexts = []
              start = 0
              while True:
                  i = js.find(t, start)
                  if i < 0: break
                  contexts.append(js[max(0,i-3500):min(len(js),i+5000)])
                  start = i + len(t)
              out[t] = contexts

          with open("research-output/endpoint-contexts.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

          for k,v in out.items():
              print("\n===== ENDPOINT", k, "OCCURRENCES", len(v), "=====")
              for idx,c in enumerate(v):
                  print("\n---", idx+1, "---\n", c)
          PY

      - name: Upload JS contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: settlement-mapsearch-js-contract
          path: research-output/
          retention-days: 3
