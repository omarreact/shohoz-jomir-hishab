name: Map page exact contract probe

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract DLRMS/ePorcha map page contracts
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, ssl, urllib.request
          from urllib.parse import urljoin, urlparse

          ctx=ssl.create_default_context()
          UA="Mozilla/5.0 (compatible; LandBDResearch/1.0)"

          def get(url, referer=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if referer:h["Referer"]=referer
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=15,context=ctx) as r:
                  return r.read().decode("utf-8","replace")

          def page_scripts(page):
              html=get(page)
              src=set()
              for pat in [r'<script[^>]+src=["\']([^"\']+)["\']',r'<link[^>]+href=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']']:
                  for m in re.finditer(pat,html,re.I):
                      u=urljoin(page,m.group(1))
                      if urlparse(u).hostname==urlparse(page).hostname:src.add(u)
              return html,sorted(src)

          def scan(page, terms):
              html,scripts=page_scripts(page)
              def one(u):
                  try:
                      js=get(u,page)
                      hits=[]
                      for t in terms:
                          p=0
                          while True:
                              i=js.find(t,p)
                              if i<0:break
                              hits.append({"term":t,"snippet":js[max(0,i-2200):min(len(js),i+3200)]})
                              p=i+len(t)
                      return {"script":u,"hits":hits}
                  except Exception as e:
                      return {"script":u,"error":repr(e),"hits":[]}
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                  rows=list(ex.map(one,scripts))
              return {"scripts":len(scripts),"rows":[r for r in rows if r["hits"]]}

          dl=scan("https://dlrms.land.gov.bd/mouza-map-application",[
              "useFetchPublicMapMouzaJlNumbers","API_PUBLIC_MAP_MOUZA_JL_NUMBERS",
              "API_PUBLIC_MOUZA_MAP","API_MAP_PUBLIC_IMAGE_FILE_VIEW",
              "map-mouzas/jl-numbers","image-view-file","map-mouza"
          ])
          ep=scan("https://eporcha.tech/mouza-map",[
              "/api/","mouza-map","map-mouza","map-survey","map-district",
              "geojson","pdf","download","survey"
          ])

          def candidates(result):
              vals=set()
              for r in result["rows"]:
                  for h in r["hits"]:
                      for m in re.finditer(r'["\']([^"\']{3,220})["\']',h["snippet"]):
                          v=m.group(1)
                          if "/api/" in v or v.startswith("/api") or "map" in v.lower():
                              if len(v)<220:vals.add(v)
              return sorted(vals)

          out={"dlrms":dl,"eporcha":ep,"eporchaCandidates":candidates(ep)}
          with open("/tmp/map-page-contracts.json","w",encoding="utf-8") as f:json.dump(out,f,ensure_ascii=False,indent=2)

          print("DLRMS_SCRIPT_COUNT",dl["scripts"])
          for r in dl["rows"]:
              print("\nDLRMS_SCRIPT",r["script"])
              for h in r["hits"]:
                  print("\nTERM",h["term"])
                  print(h["snippet"])

          print("\nEPORCHA_CANDIDATES_BEGIN")
          for v in out["eporchaCandidates"]:print(v)
          print("EPORCHA_CANDIDATES_END")
          print("EPORCHA_SCRIPT_COUNT",ep["scripts"])
          for r in ep["rows"]:
              print("\nEP_SCRIPT",r["script"])
              for h in r["hits"]:
                  # Keep ePorcha logs compact.
                  print("\nTERM",h["term"])
                  print(h["snippet"][:4500])
          PY
