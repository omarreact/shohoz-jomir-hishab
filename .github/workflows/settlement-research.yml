name: Settlement BRS 349 research

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fast probe official Settlement survey list and MapSearch scripts
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import json, re, ssl, urllib.parse, urllib.request
          from urllib.parse import urljoin, urlparse

          ORIGIN = "https://settlement.gov.bd"
          UA = "Mozilla/5.0 (compatible; LandBDResearch/1.0)"
          ctx = ssl.create_default_context()

          def get(url, accept="*/*"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": accept,
                  "Referer": ORIGIN + "/Map/MapSearch",
              })
              with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                  return r.status, r.headers.get("content-type"), r.read()

          def post(path, form):
              body = urllib.parse.urlencode(form).encode()
              req = urllib.request.Request(ORIGIN + path, data=body, headers={
                  "User-Agent": UA,
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "Origin": ORIGIN,
                  "Referer": ORIGIN + "/Map/MapSearch",
                  "X-Requested-With": "XMLHttpRequest",
              }, method="POST")
              with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                  raw = r.read()
                  try:
                      data = json.loads(raw.decode("utf-8"))
                  except Exception:
                      data = raw.decode("utf-8", "replace")
                  return {"status": r.status, "contentType": r.headers.get("content-type"), "data": data}

          def save(name, value):
              with open("research-output/" + name, "w", encoding="utf-8") as f:
                  json.dump(value, f, ensure_ascii=False, indent=2)

          def rows(value):
              out = []
              if isinstance(value, list):
                  for x in value:
                      if isinstance(x, dict): out.append(x)
                      out += rows(x)
              elif isinstance(value, dict):
                  for v in value.values():
                      out += rows(v)
              return out

          surveys = post("/Khatian/GetSurveyListDistrictWise", {
              "districtid": "010500000",
              "comcod": "4105",
          })
          save("surveys.json", surveys)
          survey_rows = rows(surveys.get("data"))
          save("survey-rows.json", survey_rows)
          print("SURVEY_ROWS=" + json.dumps(survey_rows, ensure_ascii=False))

          status, ctype, raw = get(ORIGIN + "/Map/MapSearch", "text/html")
          html = raw.decode("utf-8", "replace")
          script_srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          endpoints = set()
          evidence = {}
          script_urls = []
          for src in script_srcs:
              u = urljoin(ORIGIN, src)
              if urlparse(u).hostname != "settlement.gov.bd":
                  continue
              script_urls.append(u)
              try:
                  _, _, jsraw = get(u)
                  js = jsraw.decode("utf-8", "replace")
                  found = set(re.findall(r'/(?:Khatian|Map)/[A-Za-z0-9_/-]+', js))
                  found.update(re.findall(r'["\']([^"\']*Get[A-Za-z0-9_/-]+[^"\']*)["\']', js))
                  if found:
                      evidence[u] = sorted(x for x in found if len(x) < 220)
                      endpoints.update(evidence[u])
              except Exception as e:
                  evidence[u] = ["ERROR: " + repr(e)]
          scripts = {"pageStatus": status, "scriptUrls": script_urls, "endpoints": sorted(endpoints), "evidence": evidence}
          save("scripts.json", scripts)
          print("SCRIPT_ENDPOINTS=" + json.dumps(scripts, ensure_ascii=False))
          PY

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-brs-349-fast
          path: research-output/
          retention-days: 3
