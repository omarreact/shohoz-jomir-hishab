name: Settlement BRS 349 research

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe official Settlement public endpoints
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import json, re, ssl, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          ORIGIN = "https://settlement.gov.bd"
          UA = "Mozilla/5.0 (compatible; LandBDResearch/1.0)"
          ctx = ssl.create_default_context()

          def get(url, accept="*/*"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": accept,
                  "Referer": ORIGIN + "/Map/MapSearch",
              })
              with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                  return r.status, r.headers.get("content-type"), r.read()

          def post(path, form):
              body = urllib.parse.urlencode(form).encode()
              req = urllib.request.Request(ORIGIN + path, data=body, headers={
                  "User-Agent": UA,
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "Origin": ORIGIN,
                  "Referer": ORIGIN + "/Map/MapSearch",
                  "X-Requested-With": "XMLHttpRequest",
              }, method="POST")
              with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                  raw = r.read()
                  ctype = r.headers.get("content-type")
                  try:
                      data = json.loads(raw.decode("utf-8"))
                  except Exception:
                      data = raw.decode("utf-8", "replace")
                  return {"status": r.status, "contentType": ctype, "data": data}

          def save(name, value):
              with open("research-output/" + name, "w", encoding="utf-8") as f:
                  json.dump(value, f, ensure_ascii=False, indent=2)

          def rows(value):
              out = []
              if isinstance(value, list):
                  for x in value:
                      if isinstance(x, dict): out.append(x)
                      out += rows(x)
              elif isinstance(value, dict):
                  for v in value.values():
                      out += rows(v)
              return out

          # 1) Discover MapSearch scripts and endpoint-like strings.
          status, ctype, html_raw = get(ORIGIN + "/Map/MapSearch", "text/html")
          html = html_raw.decode("utf-8", "replace")
          with open("research-output/mapsearch.html", "w", encoding="utf-8") as f:
              f.write(html)

          script_srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          script_urls = []
          endpoint_evidence = {}
          endpoints = set()
          for src in script_srcs:
              u = urljoin(ORIGIN, src)
              if urlparse(u).hostname != "settlement.gov.bd":
                  continue
              script_urls.append(u)
              try:
                  s, ct, raw = get(u)
                  text = raw.decode("utf-8", "replace")
                  matches = set(re.findall(r'/(?:Khatian|Map)/[A-Za-z0-9_/-]+', text))
                  for m in re.findall(r'["\']([^"\']*(?:Get[A-Za-z0-9_/-]+|MapSearch)[^"\']*)["\']', text):
                      if len(m) < 220 and ("Khatian" in m or "Map" in m or m.startswith("/")):
                          matches.add(m)
                  if matches:
                      endpoint_evidence[u] = sorted(matches)
                      endpoints.update(matches)
              except Exception as e:
                  endpoint_evidence[u] = ["ERROR: " + repr(e)]

          save("scripts.json", {
              "pageStatus": status,
              "scriptUrls": script_urls,
              "endpoints": sorted(endpoints),
              "evidence": endpoint_evidence,
          })

          # 2) Selector chain: Dhaka -> surveys.
          surveys = post("/Khatian/GetSurveyListDistrictWise", {
              "districtid": "010500000",
              "comcod": "4105",
          })
          save("surveys.json", surveys)

          survey_rows = rows(surveys.get("data"))
          print("SURVEY_ROWS")
          print(json.dumps(survey_rows, ensure_ascii=False))

          def survey_blob(r):
              return " ".join(str(v) for v in r.values()).lower()

          brs_candidates = [
              r for r in survey_rows
              if any(k in survey_blob(r) for k in ["brs", "বি আর এস", "বিআরএস", "বি.আর.এস", "b.r.s"])
          ]
          save("brs-candidates.json", brs_candidates)
          print("BRS_CANDIDATES")
          print(json.dumps(brs_candidates, ensure_ascii=False))

          # Probe every survey's Gulshan + Patira if selector count is manageable.
          all_probe = []
          for r in survey_rows[:50]:
              rsnum = r.get("rsnum") or r.get("RSNUM") or r.get("rsno") or r.get("RSNO") or r.get("id") or r.get("ID")
              if rsnum is None or not str(rsnum).isdigit():
                  continue
              rsnum = str(rsnum)
              try:
                  thanas = post("/Khatian/GetThanaListBySurveyMap", {
                      "comcod": "4105",
                      "rsno1": rsnum,
                      "districtid": "010500000",
                  })
                  tr = rows(thanas.get("data"))
                  gulshan = [x for x in tr if "গুলশান" in " ".join(map(str,x.values())) or "gulshan" in " ".join(map(str,x.values())).lower()]
                  entry = {"survey": r, "gulshan": gulshan}
                  for g in gulshan:
                      unit = g.get("upzcod") or g.get("unitcod") or g.get("UPZCOD") or g.get("UNITCOD")
                      if unit is None: continue
                      try:
                          mouzas = post("/Khatian/GetMouzaListBySurveyMap", {
                              "comcod": "4105",
                              "rsnum": rsnum,
                              "unitcod": str(unit),
                          })
                          mr = rows(mouzas.get("data"))
                          patira = [x for x in mr if "পাতিরা" in " ".join(map(str,x.values())) or "patira" in " ".join(map(str,x.values())).lower()]
                          entry.setdefault("patira", []).extend(patira)
                      except Exception as e:
                          entry.setdefault("errors", []).append("mouza: " + repr(e))
                  all_probe.append(entry)
              except Exception as e:
                  all_probe.append({"survey": r, "error": repr(e)})

          save("dhaka-gulshan-patira-surveys.json", all_probe)
          print("PATIRA_SURVEY_PROBES")
          print(json.dumps(all_probe, ensure_ascii=False))

          # 3) For every Patira survey response, probe advertised sheet numbers.
          sheets = []
          for entry in all_probe:
              survey = entry.get("survey", {})
              rsnum = survey.get("rsnum") or survey.get("RSNUM") or survey.get("rsno") or survey.get("RSNO") or survey.get("id") or survey.get("ID")
              if rsnum is None: continue
              for p in entry.get("patira", []):
                  unit = p.get("unitcod") or p.get("UNITCOD") or "010505005"
                  raw_sheet = p.get("shetnum") or p.get("sheetnum") or p.get("sheetno") or p.get("SHETNUM") or p.get("SHEETNUM") or p.get("SHEETNO")
                  candidates = re.findall(r'\d+', str(raw_sheet or ""))
                  if not candidates:
                      candidates = ["001"]
                  for sh in candidates[:20]:
                      sheetno = sh.zfill(3)
                      try:
                          resp = post("/Khatian/GetSheetJsonBySurvey", {
                              "rsnum": str(rsnum),
                              "comcod": "4105",
                              "unitcod": str(unit),
                              "sheetno": sheetno,
                          })
                          features = []
                          d = resp.get("data")
                          if isinstance(d, dict) and isinstance(d.get("features"), list):
                              features = d["features"]
                          target = [
                              f for f in features
                              if str((f.get("properties") or {}).get("Dag_No")) in {"1974","1977","1990","2006"}
                          ]
                          sheets.append({
                              "survey": survey,
                              "patira": p,
                              "sheetno": sheetno,
                              "featureCount": len(features),
                              "targetFeatures": target,
                              "status": resp.get("status"),
                          })
                      except Exception as e:
                          sheets.append({"survey": survey, "patira": p, "sheetno": sheetno, "error": repr(e)})

          save("patira-sheet-targets.json", sheets)
          print("SHEET_TARGETS")
          print(json.dumps(sheets, ensure_ascii=False))
          PY

      - name: List result files
        if: always()
        run: ls -lah research-output && for f in research-output/*.json; do echo "===== $f ====="; head -c 20000 "$f"; echo; done

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-brs-349-research
          path: research-output/
          retention-days: 3
