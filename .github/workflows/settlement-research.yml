name: DLRMS BRS 349 raw public payload probe

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture raw public index and Hal-Sabek payloads
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import http.cookiejar, json, ssl, urllib.parse, urllib.request, urllib.error

          HOME="https://dlrms.land.gov.bd/"
          BASE="https://gateway.dlrms.land.gov.bd/core-api/api/public"
          UA="Mozilla/5.0 (compatible; LandBDResearch/1.0)"
          ctx=ssl.create_default_context()
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar),
              urllib.request.HTTPSHandler(context=ctx),
          )
          with opener.open(urllib.request.Request(HOME,headers={"User-Agent":UA,"Accept":"text/html"}),timeout=25) as r:
              r.read()
          token=next((c.value for c in jar if c.name=="dlrms_app_token"),None)
          if not token: raise RuntimeError("no public app token")
          headers={"User-Agent":UA,"Accept":"application/json","Authorization":"Bearer "+token,"Origin":"https://dlrms.land.gov.bd","Referer":HOME}

          def get(path, params=None):
              url=BASE+path
              if params: url += "?" + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                      raw=r.read(1000000).decode("utf-8","replace")
                      try: data=json.loads(raw)
                      except: data=raw
                      return {"status":r.status,"path":path,"params":params or {},"data":data}
              except urllib.error.HTTPError as e:
                  raw=e.read(200000).decode("utf-8","replace")
                  try: data=json.loads(raw)
                  except: data=raw
                  return {"status":e.code,"path":path,"params":params or {},"data":data}

          baseq={"SURVEY":"BRS","JL_NUMBER_ID":"382911","PAGE_NO":"1","PAGE_SIZE":"100"}
          probes=[]
          probes.append(("khatian349",get("/index-khatian/BRS",{**baseq,"KHATIAN_NO":"349"})))
          for dag in ["1974","1977","1990","2006"]:
              probes.append(("dag-"+dag,get("/index-khatian/BRS",{**baseq,"DAG_NUMBER":dag})))

          common={"DIVISION_BBS_CODE":"30","DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","JL_NUMBER_ID":"382911","KHATIAN_NO":"349"}
          variants=[
              {**common,"SURVEY_TYPE":"BRS"},
              {**common,"SURVEY_ID":"7"},
              {**common,"SURVEY":"BRS"},
              {**common,"SURVEY_TYPE":"7"},
              {**common,"SURVEY_TYPE_ID":"7"},
          ]
          for i,v in enumerate(variants,1):
              probes.append((f"hal-sabek-{i}",get("/hal-sabeks/khatian",v)))

          with open("research-output/raw-public.json","w",encoding="utf-8") as f:
              json.dump(probes,f,ensure_ascii=False,indent=2)

          for name,res in probes:
              print("\n===== "+name+" STATUS "+str(res["status"])+" =====")
              print("PARAMS",json.dumps(res["params"],ensure_ascii=False))
              print(json.dumps(res["data"],ensure_ascii=False)[:80000])
          PY
      - name: Upload raw public payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlrms-brs-349-raw-public
          path: research-output/
          retention-days: 3
