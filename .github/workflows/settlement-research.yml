name: DLRMS BRS 349 read-only boundary probe

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe known DLRMS read-only BRS routes with public app session
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import http.cookiejar, json, ssl, urllib.parse, urllib.request, urllib.error

          HOME="https://dlrms.land.gov.bd/"
          GATE="https://gateway.dlrms.land.gov.bd"
          UA="Mozilla/5.0 (compatible; LandBDResearch/1.0)"
          ctx=ssl.create_default_context()
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar),
              urllib.request.HTTPSHandler(context=ctx),
          )

          req=urllib.request.Request(HOME,headers={"User-Agent":UA,"Accept":"text/html"})
          with opener.open(req,timeout=25) as r:
              r.read()

          token=None
          for c in jar:
              if c.name=="dlrms_app_token":
                  token=c.value
          if not token:
              raise RuntimeError("Public app token cookie was not issued")
          print("PUBLIC_APP_SESSION_READY", True)
          print("COOKIE_NAMES", sorted({c.name for c in jar}))

          headers={
              "User-Agent":UA,
              "Accept":"application/json, text/plain, */*",
              "Authorization":"Bearer "+token,
              "Origin":"https://dlrms.land.gov.bd",
              "Referer":"https://dlrms.land.gov.bd/",
          }

          candidates=[
              ("baseline-public","/core-api/api/public/index-khatian/BRS/7940305"),
              ("brs-khatian-by-record-id","/core-api/api/brs-khatians/7940305"),
              ("brs-khatian-by-entry-id","/core-api/api/brs-khatians/3197289"),
              ("dags-q-khatian-id","/core-api/api/brs-khatian-dags?KHATIAN_ID=7940305"),
              ("dags-q-entry-id","/core-api/api/brs-khatian-dags?KHATIAN_ENTRY_ID=3197289"),
              ("dags-q-camel-khatian","/core-api/api/brs-khatian-dags?khatianId=7940305"),
              ("dags-q-camel-entry","/core-api/api/brs-khatian-dags?khatianEntryId=3197289"),
              ("dags-path-record","/core-api/api/brs-khatian-dags/7940305"),
              ("dags-path-entry","/core-api/api/brs-khatian-dags/3197289"),
              ("owners-path-record","/core-api/api/brs-khatian-owners/7940305"),
              ("owners-path-entry","/core-api/api/brs-khatian-owners/3197289"),
              ("owners-q-khatian-id","/core-api/api/brs-khatian-owners?KHATIAN_ID=7940305"),
              ("owners-q-entry-id","/core-api/api/brs-khatian-owners?KHATIAN_ENTRY_ID=3197289"),
          ]

          results=[]
          for name,path in candidates:
              url=GATE+path
              req=urllib.request.Request(url,headers=headers,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                      raw=r.read(500000)
                      txt=raw.decode("utf-8","replace")
                      try: data=json.loads(txt)
                      except: data=txt[:12000]
                      results.append({"name":name,"path":path,"status":r.status,"contentType":r.headers.get("content-type"),"data":data})
                      print("\nPROBE",name,"STATUS",r.status)
                      print(json.dumps(data,ensure_ascii=False)[:30000])
              except urllib.error.HTTPError as e:
                  raw=e.read(100000).decode("utf-8","replace")
                  try: data=json.loads(raw)
                  except: data=raw[:3000]
                  results.append({"name":name,"path":path,"status":e.code,"data":data})
                  print("\nPROBE",name,"STATUS",e.code)
                  print(json.dumps(data,ensure_ascii=False)[:6000])
              except Exception as e:
                  results.append({"name":name,"path":path,"error":repr(e)})
                  print("\nPROBE",name,"ERROR",repr(e))

          with open("research-output/dlrms-brs-boundary.json","w",encoding="utf-8") as f:
              json.dump(results,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload read-only probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlrms-brs-349-boundary
          path: research-output/
          retention-days: 3
