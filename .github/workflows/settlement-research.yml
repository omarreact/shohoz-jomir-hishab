name: Public mirror BRS 349 probe

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe configured public DLRMS mirror
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import json, ssl, urllib.parse, urllib.request, urllib.error

          BASE="https://eporcha.tech/api/dlrms"
          ctx=ssl.create_default_context()
          headers={"User-Agent":"Mozilla/5.0 (compatible; LandBDResearch/1.0)","Accept":"application/json"}

          def get(path,params=None):
              url=BASE+path
              if params: url+="?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                      raw=r.read(1000000).decode("utf-8","replace")
                      try:data=json.loads(raw)
                      except:data=raw
                      return {"url":url,"status":r.status,"contentType":r.headers.get("content-type"),"data":data}
              except urllib.error.HTTPError as e:
                  raw=e.read(200000).decode("utf-8","replace")
                  try:data=json.loads(raw)
                  except:data=raw
                  return {"url":url,"status":e.code,"data":data}
              except Exception as e:
                  return {"url":url,"error":repr(e)}

          q={"SURVEY":"BRS","JL_NUMBER_ID":"382911","KHATIAN_NO":"349","PAGE_NO":"1","PAGE_SIZE":"100"}
          probes=[
              ("list",get("/index-khatian/BRS",q)),
              ("detail",get("/index-khatian/BRS/7940305")),
          ]
          for dag in ["1974","1977","1990","2006"]:
              probes.append(("dag-"+dag,get("/index-khatian/BRS",{"SURVEY":"BRS","JL_NUMBER_ID":"382911","DAG_NUMBER":dag,"PAGE_NO":"1","PAGE_SIZE":"100"})))

          with open("research-output/eporcha-349.json","w",encoding="utf-8") as f:
              json.dump(probes,f,ensure_ascii=False,indent=2)
          for name,res in probes:
              print("\n====",name,"====")
              safe={k:v for k,v in res.items() if k!="url"}
              print(json.dumps(safe,ensure_ascii=False)[:80000])
          PY
      - name: Upload mirror artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eporcha-public-mirror-349
          path: research-output/
          retention-days: 3
