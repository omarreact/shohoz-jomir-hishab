name: Public map catalogue probe

on:
  push:
    branches: [research/settlement-brs-349]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Probe DLRMS public map API and crawl ePorcha Dhaka map tree
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import http.cookiejar, json, re, ssl, time, urllib.parse, urllib.request, urllib.error
          from collections import deque

          ctx=ssl.create_default_context()
          UA="Mozilla/5.0 (compatible; LandBDResearch/1.0)"

          # ---------- DLRMS public app session ----------
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar),
              urllib.request.HTTPSHandler(context=ctx),
          )
          home="https://dlrms.land.gov.bd/"
          with opener.open(urllib.request.Request(home,headers={"User-Agent":UA,"Accept":"text/html"}),timeout=25) as r:
              r.read()
          token=next((c.value for c in jar if c.name=="dlrms_app_token"),None)
          if not token: raise RuntimeError("DLRMS public app token missing")
          h={"User-Agent":UA,"Accept":"application/json","Authorization":"Bearer "+token,"Origin":"https://dlrms.land.gov.bd","Referer":home}
          base="https://gateway.dlrms.land.gov.bd/core-api/api/public"

          def dlget(path,params=None):
              url=base+path
              if params:url+="?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=h,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                      raw=r.read(1000000).decode("utf-8","replace")
                      try:data=json.loads(raw)
                      except:data=raw
                      return {"status":r.status,"params":params or {},"data":data}
              except urllib.error.HTTPError as e:
                  raw=e.read(200000).decode("utf-8","replace")
                  try:data=json.loads(raw)
                  except:data=raw
                  return {"status":e.code,"params":params or {},"data":data}
              except Exception as e:
                  return {"error":repr(e),"params":params or {}}

          map_mouza_variants=[
              {},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY_ID":"7"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY":"BRS"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY_ID":"7","SURVEY":"BRS"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY_ID":"7","X_SURVEY_KEY":"BRS"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY_ID":"7","SURVEY":"BRS","X_SURVEY_KEY":"BRS"},
          ]
          dl_results=[]
          for p in map_mouza_variants:
              dl_results.append({"endpoint":"map-mouzas/jl-numbers",**dlget("/map-mouzas/jl-numbers",p)})

          # Known target IDs, test likely map-list parameters only on public endpoint.
          map_variants=[
              {},
              {"JL_NUMBER_ID":"382911"},
              {"MOUZA_ID":"71947"},
              {"SURVEY_ID":"7"},
              {"JL_NUMBER_ID":"382911","SURVEY_ID":"7"},
              {"MOUZA_ID":"71947","SURVEY_ID":"7"},
              {"JL_NUMBER_ID":"382911","MOUZA_ID":"71947","SURVEY_ID":"7"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY_ID":"7","JL_NUMBER_ID":"382911"},
              {"DISTRICT_BBS_CODE":"26","UPAZILA_BBS_CODE":"26","SURVEY":"BRS","JL_NUMBER_ID":"382911"},
          ]
          for p in map_variants:
              dl_results.append({"endpoint":"maps",**dlget("/maps",p)})

          with open("research-output/dlrms-map-probes.json","w",encoding="utf-8") as f:
              json.dump(dl_results,f,ensure_ascii=False,indent=2)
          print("DLRMS_MAP_PROBES_BEGIN")
          for x in dl_results:
              print("\n",x["endpoint"],"STATUS",x.get("status"),"PARAMS",json.dumps(x.get("params"),ensure_ascii=False))
              print(json.dumps(x.get("data"),ensure_ascii=False)[:30000])
          print("DLRMS_MAP_PROBES_END")

          # ---------- ePorcha public Google-Drive-backed map tree ----------
          epbase="https://eporcha.tech"
          root="1sP964F_b1GGxdjMNvmlgbiG7RRdtsfEA"  # Dhaka root published in frontend JS

          def eppost(path,obj):
              body=json.dumps(obj).encode()
              req=urllib.request.Request(epbase+path,data=body,headers={
                  "User-Agent":UA,"Accept":"application/json","Content-Type":"application/json",
                  "Origin":epbase,"Referer":epbase+"/mouza-map"
              },method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=25,context=ctx) as r:
                      raw=r.read(2000000).decode("utf-8","replace")
                      try:data=json.loads(raw)
                      except:data=raw
                      return {"status":r.status,"data":data}
              except urllib.error.HTTPError as e:
                  raw=e.read(200000).decode("utf-8","replace")
                  try:data=json.loads(raw)
                  except:data=raw
                  return {"status":e.code,"data":data}
              except Exception as e:return {"error":repr(e)}

          first=eppost("/api/mouza-map/browse",{"parentId":root})
          print("\nEPORCHA_DHAKA_ROOT",json.dumps(first,ensure_ascii=False)[:80000])

          def files_from(resp):
              d=resp.get("data") if isinstance(resp,dict) else None
              if isinstance(d,dict):
                  inner=d.get("data",d)
                  if isinstance(inner,dict) and isinstance(inner.get("files"),list):return inner["files"]
                  if isinstance(d.get("files"),list):return d["files"]
              return []

          # BFS, but descend preferentially through names that plausibly lead to Dhaka/Gulshan/Patira/BRS.
          q=deque()
          for item in files_from(first): q.append((item,1,"ঢাকা"))
          seen=set()
          matches=[]
          visited=[]
          keywords=["পাতিরা","patira","গুলশান","gulshan","brs","বি আর এস","বি.আর.এস","বিআরএস","জে এল ৫","jl 5","005"]
          max_nodes=2500
          while q and len(visited)<max_nodes:
              item,depth,path=q.popleft()
              fid=str(item.get("id") or item.get("fileId") or "")
              name=str(item.get("name") or item.get("fileName") or "")
              mime=str(item.get("mimeType") or "")
              isfolder=bool(item.get("isFolder")) or mime=="application/vnd.google-apps.folder"
              full=path+"/"+name
              rec={"id":fid,"name":name,"mimeType":mime,"isFolder":isfolder,"path":full}
              visited.append(rec)
              low=full.lower()
              if any(k.lower() in low for k in keywords):matches.append(rec)

              if isfolder and fid and fid not in seen and depth<7:
                  seen.add(fid)
                  # At shallow levels browse all; deeper levels prioritize relevant branches.
                  should=depth<=3 or any(k in low for k in ["ঢাকা","dhaka","গুলশান","gulshan","পাতিরা","patira","brs","বি আর এস","বি.আর.এস","বিআরএস"])
                  if should:
                      resp=eppost("/api/mouza-map/browse",{"parentId":fid})
                      for ch in files_from(resp):q.append((ch,depth+1,full))
                      time.sleep(0.06)

          details=[]
          for m in matches:
              if not m["isFolder"] and m["id"]:
                  d=eppost("/api/mouza-map/file",{"fileId":m["id"]})
                  details.append({"match":m,"detail":d})

          epout={"root":first,"visitedCount":len(visited),"matches":matches,"details":details}
          with open("research-output/eporcha-dhaka-map-tree.json","w",encoding="utf-8") as f:
              json.dump(epout,f,ensure_ascii=False,indent=2)

          print("\nEPORCHA_MATCHES_BEGIN")
          print(json.dumps({"visitedCount":len(visited),"matches":matches,"details":details},ensure_ascii=False)[:120000])
          print("EPORCHA_MATCHES_END")
          PY
      - name: Upload map probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-map-catalogue-probe
          path: research-output/
          retention-days: 3
