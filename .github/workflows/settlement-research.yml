name: DLRMS public frontend research

on:
  push:
    branches:
      - research/settlement-brs-349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parallel-scan DLRMS public frontend chunks
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import concurrent.futures, http.cookiejar, json, re, ssl, urllib.request
          from urllib.parse import urljoin, urlparse

          ORIGIN = "https://dlrms.land.gov.bd"
          UA = "Mozilla/5.0 (compatible; LandBDResearch/1.0)"
          ctx = ssl.create_default_context()
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar),
              urllib.request.HTTPSHandler(context=ctx),
          )

          def fetch_with(op, url, accept="*/*", timeout=10):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": accept, "Referer": ORIGIN + "/",
              })
              with op.open(req, timeout=timeout) as r:
                  return r.status, r.headers.get("content-type"), r.read()

          status, ctype, raw = fetch_with(opener, ORIGIN + "/", "text/html,application/xhtml+xml", 20)
          html = raw.decode("utf-8", "replace")
          cookie_names = sorted({c.name for c in jar})
          print("HOME", status, "COOKIES", cookie_names)

          srcs = set()
          for pat in [
              r'<script[^>]+src=["\']([^"\']+)["\']',
              r'<link[^>]+href=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',
          ]:
              for m in re.finditer(pat, html, re.I):
                  u = urljoin(ORIGIN, m.group(1))
                  if urlparse(u).hostname == "dlrms.land.gov.bd":
                      srcs.add(u)

          # Reuse only cookie NAMES conceptually; each worker doesn't need authenticated cookie
          # for public static chunks. Homepage token values are never printed or stored.
          def scan(u):
              try:
                  worker = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
                  s, ct, b = fetch_with(worker, u, "*/*", 9)
                  if len(b) > 10_000_000: return {"url":u,"error":"too-large"}
                  js = b.decode("utf-8", "replace")
                  vals = set()
                  pats = [
                      r'https://gateway\.dlrms\.land\.gov\.bd[^"\'\s<>\\]{1,300}',
                      r'https://api\.land\.gov\.bd[^"\'\s<>\\]{1,300}',
                      r'/(?:core-api/)?api/(?:public/)?[A-Za-z0-9_?&=./{}:\-]{2,300}',
                      r'/[A-Za-z0-9_\-/{}/.]{0,120}(?:khatian|khatiyan|dag|owner|porcha|print|pdf|download|report|application|tracking|hal-sabek)[A-Za-z0-9_?&=./{}:\-]{0,180}',
                  ]
                  for p in pats:
                      for m in re.finditer(p, js, re.I):
                          v=m.group(0).rstrip("),;]")
                          if len(v) < 320: vals.add(v)
                  contexts=[]
                  for v in sorted(vals)[:120]:
                      i=js.find(v)
                      if i>=0:
                          snip=js[max(0,i-500):min(len(js),i+len(v)+700)]
                          snip=re.sub(r'(?i)(authorization|access[_-]?token|refresh[_-]?token)(["\'\s:=]+)[A-Za-z0-9._~+/-]{20,}',r'\1\2[REDACTED]',snip)
                          contexts.append({"endpoint":v,"snippet":snip})
                  return {"url":u,"status":s,"contexts":contexts}
              except Exception as e:
                  return {"url":u,"error":repr(e)}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              for item in ex.map(scan, sorted(srcs)):
                  results.append(item)

          endpoints=sorted({c["endpoint"] for r in results for c in r.get("contexts",[])})
          result={
              "homeStatus":status,
              "cookieNames":cookie_names,
              "scriptCount":len(srcs),
              "scripts":sorted(srcs),
              "endpoints":endpoints,
              "results":results,
          }
          with open("research-output/dlrms-fast.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)

          print("SCRIPTS",len(srcs))
          print("ENDPOINTS_BEGIN")
          for e in endpoints: print(e)
          print("ENDPOINTS_END")
          for r in results:
              if r.get("contexts"):
                  print("\nSCRIPT",r["url"])
                  for c in r["contexts"]:
                      print("\nEP",c["endpoint"])
                      print(c["snippet"])
          PY

      - name: Upload DLRMS fast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlrms-public-js-fast
          path: research-output/
          retention-days: 3
