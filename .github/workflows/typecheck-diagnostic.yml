name: Temporary typecheck diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Capture typecheck output
        run: npm run typecheck > typecheck-diagnostic.txt 2>&1 || true
      - name: Upload typecheck output
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck-diagnostic.txt
