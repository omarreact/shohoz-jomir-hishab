name: Restore GeospatialMap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full map UI from redesign (keep current mobile CSS)
        run: |
          git fetch origin redesign/landbd-ux-2026:redesign/landbd-ux-2026
          # Full component: layers panel, basemap toggle, results (public + auth)
          git show redesign/landbd-ux-2026:src/features/geospatial-map/components/GeospatialMap.tsx > src/features/geospatial-map/components/GeospatialMap.tsx
          # Do NOT overwrite GeospatialMap.module.css — main already has iPhone/safe-area CSS

      - name: Commit and push to main
        run: |
          git config user.name "LandBD CI"
          git config user.email "ci@landbd.local"
          git add src/features/geospatial-map/components/GeospatialMap.tsx
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "fix(map): restore full geospatial UI (basemap, layers, results)"
          git push origin HEAD:main
