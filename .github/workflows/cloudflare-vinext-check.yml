name: Cloudflare vinext compatibility

on:
  push:
    branches:
      - infra/cloudflare-landbd-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run vinext compatibility check
        run: npx --yes vinext@latest check
