name: Generate Next 16.3.7 lockfile

on:
  push:
    branches:
      - chore/next-security-16.3.7

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/next-security-16.3.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh lockfile for Next.js 16.3.7"
            git push origin HEAD:chore/next-security-16.3.7
          fi
