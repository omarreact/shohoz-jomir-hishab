name: Generate Next 16.3.7 lockfile

on:
  push:
    branches:
      - chore/next-security-16.3.7

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: next-16.3.7-package-lock
          path: package-lock.json
          retention-days: 1
