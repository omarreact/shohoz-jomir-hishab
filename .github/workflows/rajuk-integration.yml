name: RAJUK Integration Test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/rajuk-smoke-test.ts"
      - "src/services/rajuk/**"
      - ".github/workflows/rajuk-integration.yml"

jobs:
  rajuk-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RAJUK smoke test
        env:
          RAJUK_SERVER_TOKEN: ${{ secrets.RAJUK_SERVER_TOKEN }}
          RAJUK_PORTAL_TOKEN: ${{ secrets.RAJUK_PORTAL_TOKEN }}
          RAJUK_PORTAL_USERNAME: ${{ secrets.RAJUK_PORTAL_USERNAME }}
          RAJUK_PORTAL_PASSWORD: ${{ secrets.RAJUK_PORTAL_PASSWORD }}
        run: npx tsx scripts/rajuk-smoke-test.ts
