name: DLRMS Public API Smoke (Read Only)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/land-records/**"
      - ".github/workflows/dlrms-public-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous government discovery API (no token, no PII)
        shell: bash
        run: |
          node <<'NODE'
          const base = "https://gateway.dlrms.land.gov.bd/core-api/api/public";
          const endpoints = ["/config/app-access", "/surveys?ROW_STATUS=1"];
          let failed = false;
          for (const path of endpoints) {
            try {
              const response = await fetch(base + path, {
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(12000),
                redirect: "error",
              });
              const type = response.headers.get("content-type") || "";
              let validJson = false;
              if (response.ok && type.includes("json")) {
                const payload = await response.json();
                validJson = Boolean(payload && typeof payload === "object");
              }
              // Metadata only. Never log response bodies, cookies, tokens or citizen data.
              console.log(path + ": HTTP " + response.status +
                ", json=" + validJson + ", content-type=" + type.split(";")[0]);
              // 401/403 now means the government gateway is reachable but no longer
              // anonymously readable. Treat that as an upstream access-policy signal,
              // not as a LandBD code regression.
              if (response.status === 401 || response.status === 403) {
                console.log(path + ": upstream requires authentication (expected/allowed)");
                continue;
              }
              if (!response.ok || !validJson) failed = true;
            } catch (error) {
              console.log(path + ": NETWORK_ERROR " + (error?.name || "unknown"));
              failed = true;
            }
          }
          if (failed) {
            console.error("DLRMS discovery smoke failed due to network/server/invalid-JSON behavior.");
            process.exitCode = 1;
          }
          NODE
