name: Cloudflare staging build

on:
  push:
    branches:
      - infra/cloudflare-landbd-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Initialize vinext Cloudflare target
        run: >-
          npx --yes vinext@latest init
          --skip-check
          --platform=cloudflare
          --cdn-cache=none
          --data-cache=none
          --image-optimization=none

      - name: Build vinext Cloudflare output
        run: npm run build:vinext
        env:
          NODE_ENV: production
          LAND_EXPORT_STORAGE_PROVIDER: firebase

      - name: Verify Cloudflare build output
        run: |
          test -f cloudflare.config.ts
          test -f vite.config.ts
          test -f dist/server/wrangler.json

      - name: Package migration output
        run: |
          tar -czf landbd-vinext-migration.tar.gz             package.json package-lock.json             vite.config.ts cloudflare.config.ts             dist/server/wrangler.json

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: landbd-vinext-migration
          path: landbd-vinext-migration.tar.gz
          if-no-files-found: error
          retention-days: 7
