name: LandBD Production Smoke (Read Only)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "proxy.ts"
      - "next.config.ts"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/landbd-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landbd-production-smoke
  cancel-in-progress: true

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the exact main commit to become healthy on Vercel
        env:
          LANDBD_ORIGIN: https://landbd.pincodeit.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.LANDBD_ORIGIN;
          const expected = process.env.EXPECTED_COMMIT;
          const attempts = 36;
          const delayMs = 10_000;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const response = await fetch(origin + "/api/health", {
                cache: "no-store",
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(12_000),
              });
              const payload = response.ok ? await response.json().catch(() => null) : null;
              const valid = Boolean(
                payload &&
                payload.success === true &&
                payload.service === "landbd" &&
                payload.status === "ok" &&
                payload.platform === "vercel" &&
                payload.environment === "production" &&
                typeof payload.commit === "string"
              );

              console.log("production health", {
                attempt,
                http: response.status,
                valid,
                servingCommit: valid ? payload.commit.slice(0, 12) : null,
                expectedCommit: expected.slice(0, 12),
              });

              if (valid && payload.commit === expected) {
                console.log("PASS: production is serving the exact GitHub main commit.");
                process.exit(0);
              }
            } catch (error) {
              console.log("production health", {
                attempt,
                networkError: error?.name || "unknown",
              });
            }

            if (attempt < attempts) await sleep(delayMs);
          }

          throw new Error("Production did not become healthy on the expected main commit within the smoke window.");
          NODE
