name: Repair Map Refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'refactor(map): refine MapLibre UI') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply surgical refactor
        run: python3 scripts/apply-map-ui-refinement.py
      - name: Validate
        run: |
          test -f src/features/geospatial-map/maplibre/exportMap.ts
          grep -q 'preserveDrawingBuffer: true' src/features/geospatial-map/maplibre/MapLibreMap.tsx
          grep -q 'action: "identify"' src/features/geospatial-map/maplibre/MapLibreMap.tsx
          grep -q 'mouza: selectedMouza' src/features/geospatial-map/maplibre/MapLibreMap.tsx
          grep -q 'rsPlotLabels' src/features/geospatial-map/maplibre/layers.ts
          grep -q 'msPlotLabels' src/features/geospatial-map/maplibre/layers.ts
      - name: Commit directly to main and remove temporary automation
        run: |
          git config user.name 'LandBD CI'
          git config user.email 'ci@landbd.local'
          git add src/features/geospatial-map/maplibre/MapLibreMap.tsx src/features/geospatial-map/maplibre/layers.ts src/features/geospatial-map/maplibre/types.ts
          git rm -f .github/workflows/apply-map-ui-refinement.yml .github/workflows/repair-map-refinement.yml scripts/apply-map-ui-refinement.py
          git commit -m 'refactor(map): refine MapLibre UI'
          git push origin HEAD:main
